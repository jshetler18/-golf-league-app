name: Build Fire TV Cup Standings APK
on:
  push:
    branches: [build/fire-tv-cup-apk]
    paths:
      - 'fire-tv-cup/**'
      - '.github/workflows/build-fire-tv-cup.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: fire-tv-cup
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CupStandings-FireTV-APK
          path: fire-tv-cup/app/build/outputs/apk/debug/app-debug.apk
